# Global Costmap Parameters
# Uses static map from SLAM for long-range planning

global_costmap:
  global_costmap:
    ros__parameters:
      # Update rates (slower than local costmap)
      update_frequency: 1.0    # Hz - costmap update rate
      publish_frequency: 1.0   # Hz - visualization update rate

      # Frame configuration
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: true

      # Static map configuration (not rolling)
      rolling_window: false
      width: 50              # meters (will auto-size to map)
      height: 50             # meters (will auto-size to map)
      resolution: 0.05       # meters per pixel (5cm, match SLAM)

      # Robot footprint
      robot_radius: 0.20
      footprint_padding: 0.01

      # Track unknown space
      track_unknown_space: true
      unknown_cost_value: 255
      use_maximum: false

      # Plugin configuration
      plugins: ["static_layer", "inflation_layer"]

      # Static layer - uses SLAM map
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /map        # From SLAM Toolbox
        subscribe_to_updates: true
        map_subscribe_transient_local: true

      # Inflation layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.30      # OPTIMIZED: Reduced from 0.35
        cost_scaling_factor: 3.0
        inflate_unknown: false
        inflate_around_unknown: true

      # Always send full costmap
      always_send_full_costmap: false
