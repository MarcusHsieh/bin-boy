# Planner Server Parameters
# NavFn Planner (Dijkstra/A*) for global path planning

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    expected_planner_frequency: 20.0  # Hz

    # GridBased planner - NavFn (Dijkstra/A*)
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25               # meters - goal tolerance for planning
      use_astar: true               # A* (true) vs Dijkstra (false)
      allow_unknown: true           # Plan through unknown space
      use_final_approach_orientation: false  # Don't force final orientation

      # Cost interpretation
      cost_travel_multiplier: 2.0   # Higher = prefer free space more

      # Alternative: Smac Planner (better for omnidirectional, higher compute)
      # plugin: "nav2_smac_planner/SmacPlanner2D"
      # tolerance: 0.25
      # downsample_costmap: false
      # downsampling_factor: 1
      # allow_unknown: true
      # max_iterations: 1000000
      # max_on_approach_iterations: 1000
      # max_planning_time: 5.0
      # motion_model_for_search: "DUBIN"  # or "REEDS_SHEPP" for reverse
      # angle_quantization_bins: 72
      # analytic_expansion_ratio: 3.5
      # analytic_expansion_max_length: 3.0
      # minimum_turning_radius: 0.2  # For omnidirectional, can be very small
      # reverse_penalty: 2.0
      # change_penalty: 0.0
      # non_straight_penalty: 1.2
      # cost_penalty: 2.0
      # retrospective_penalty: 0.015
      # lookup_table_size: 20.0
      # cache_obstacle_heuristic: false
      # smooth_path: true
