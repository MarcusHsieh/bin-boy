# Controller Server Parameters
# DWB (Dynamic Window Approach) Controller for Omnidirectional Navigation

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0  # Hz - trajectory update rate
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001  # For holonomic robots
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker - detects if robot is making progress
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5  # meters
      movement_time_allowance: 10.0  # seconds

    # Goal checker - determines when goal is reached
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10      # meters (10cm) - OPTIMIZED for precision
      yaw_goal_tolerance: 0.15     # radians (~8.6 degrees) - OPTIMIZED for precision

    # DWB Local Planner - OMNIDIRECTIONAL CONFIGURATION
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: -0.6
      min_vel_y: -0.6        # OMNIDIRECTIONAL: Enable lateral motion
      max_vel_x: 0.6         # OPTIMIZED: Increased from 0.5 (+20% speed)
      max_vel_y: 0.6         # OPTIMIZED: Increased from 0.5 (+20% speed)
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.6      # OPTIMIZED: Must match max_vel_x/y
      min_speed_theta: 0.0

      # Acceleration limits
      acc_lim_x: 0.5         # m/s^2
      acc_lim_y: 0.5         # m/s^2 - OMNIDIRECTIONAL
      acc_lim_theta: 1.0     # rad/s^2
      decel_lim_x: -0.5
      decel_lim_y: -0.5      # OMNIDIRECTIONAL
      decel_lim_theta: -1.0

      # Velocity sampling - OMNIDIRECTIONAL
      vx_samples: 15         # Sample forward/backward velocities
      vy_samples: 20         # OPTIMIZED: Increased from 15 (+33% lateral quality)
      vtheta_samples: 20     # Sample rotational velocities

      # Simulation parameters
      sim_time: 2.0          # OPTIMIZED: Increased from 1.7 (+18% lookahead)
      discretize_by_time: false
      time_granularity: 0.5
      linear_granularity: 0.05
      angular_granularity: 0.025

      # Trajectory critics (scoring functions)
      critics: [
        "RotateToGoal",      # Prefer rotating to face goal when close
        "Oscillation",       # Penalize oscillating behavior
        "BaseObstacle",      # Avoid obstacles
        "GoalAlign",         # Align with goal heading
        "PathAlign",         # Stay close to global path
        "PathDist",          # Progress along path
        "GoalDist"           # Progress toward goal
      ]

      # CRITICAL: Enable holonomic robot mode
      # This allows DWB to generate trajectories using vy (lateral velocity)
      holonomic_robot: true

      # Critic weights (tune these for performance)
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

      # Oscillation prevention
      Oscillation.scale: 1.0
      Oscillation.oscillation_reset_dist: 0.05

      # Prune path - remove points behind robot
      prune_plan: true
      prune_distance: 1.0

      # Transform tolerance
      transform_tolerance: 0.2

      # Short circuit trajectory evaluation
      short_circuit_trajectory_evaluation: true

      # Trajectory statuses to check
      stateful: true
